<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Realistic Sticker Studio - Ae Version</title>
    <link href="https://fonts.googleapis.com/css2?family=Itim&family=Kanit:wght@600&family=Mali:wght@500&family=Sriracha&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ff6b6b;
            --bg-color: #f8f9fa;
            --sticker-border: 8px solid white;
            --shadow-color: rgba(0,0,0,0.15);
        }

        body {
            font-family: 'Kanit', sans-serif;
            background-color: #eef2f3;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            color: white;
            width: 100%;
            padding: 2rem 0;
            text-align: center;
            box-shadow: 0 4px 15px var(--shadow-color);
            margin-bottom: 2rem;
        }

        .upload-container {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            margin-bottom: 2rem;
            text-align: center;
            width: 90%;
            max-width: 500px;
        }

        #file-input {
            display: none;
        }

        .upload-btn {
            background: var(--primary-color);
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: transform 0.2s;
            display: inline-block;
        }

        .upload-btn:hover {
            transform: scale(1.05);
            background: #ff5252;
        }

        .sticker-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
            width: 95%;
            max-width: 1200px;
            padding: 20px;
            margin-bottom: 50px;
        }

        .sticker-card {
            background-image:
                linear-gradient(45deg, #eee 25%, transparent 25%),
                linear-gradient(-45deg, #eee 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #eee 75%),
                linear-gradient(-45deg, transparent 75%, #eee 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px 10px, 10px 0;
            background-color: white;
            border-radius: 15px;
            padding: 20px;
            position: relative;
            aspect-ratio: 1/1.1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            border: 1px solid #ddd;
        }

        .sticker-image-wrapper {
            position: relative;
            width: 80%;
            height: 70%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .sticker-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            /* White Border (Die-cut effect) using Filter Drop Shadow */
            filter: drop-shadow(4px 0 0 white) 
                    drop-shadow(-4px 0 0 white) 
                    drop-shadow(0 4px 0 white) 
                    drop-shadow(0 -4px 0 white)
                    drop-shadow(0 0 10px rgba(0,0,0,0.2));
        }

        .sticker-text {
            margin-top: 10px;
            font-size: 24px;
            text-align: center;
            text-shadow: 2px 2px 0px white, -2px -2px 0px white, 2px -2px 0px white, -2px 2px 0px white;
            z-index: 10;
        }

        .prop-icon {
            position: absolute;
            font-size: 40px;
            z-index: 5;
        }

        footer {
            padding: 20px;
            color: #666;
            font-size: 0.9rem;
        }

        /* Responsive Mobile */
        @media (max-width: 600px) {
            .sticker-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .sticker-text {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>✨ AI Realistic Sticker Studio ✨</h1>
    <p>สร้างสติ๊กเกอร์ภาพจริง 16 อารมณ์ในคลิกเดียว</p>
</header>

<div class="upload-container">
    <label for="file-input" class="upload-btn">📸 อัปโหลดรูปภาพของคุณ</label>
    <input type="file" id="file-input" accept="image/*">
    <p style="margin-top:10px; font-size: 0.8rem; color: #888;">แนะนำภาพหน้าตรง พื้นหลังเรียบจะสวยที่สุด</p>
</div>

<div class="sticker-grid" id="sticker-grid">
    <!-- Stickers will be generated here -->
</div>

<footer>
    © 2026 OMNI Studio | พัฒนาเพื่อระบบ Line Sticker Creator (320x370 px)
</footer>

<script>
    const stickerData = [
        { text: "โอเค", emoji: "👌", font: "'Itim'", color: "#4cd137", prop: "" },
        { text: "รับทราบ", emoji: "🫡", font: "'Kanit'", color: "#2f3640", prop: "" },
        { text: "ง่วงแย้ว", emoji: "💤", font: "'Mali'", color: "#9c88ff", prop: "😴" },
        { text: "คิดถึงจุง", emoji: "💖", font: "'Sriracha'", color: "#e84393", prop: "❤️" },
        { text: "เหงาจังเยย", emoji: "🌧️", font: "'Itim'", color: "#74b9ff", prop: "💧" },
        { text: "หิวมาก", emoji: "🤤", font: "'Kanit'", color: "#e67e22", prop: "🍖" },
        { text: "เบื่อแย้ว", emoji: "🙄", font: "'Mali'", color: "#95a5a6", prop: "☁️" },
        { text: "เย้!!", emoji: "🎉", font: "'Sriracha'", color: "#f1c40f", prop: "✨" },
        { text: "กำลังไปแย้ว", emoji: "🏍️", font: "'Itim'", color: "#e74c3c", prop: "💨" },
        { text: "มอร์นิ่ง", emoji: "☀️", font: "'Kanit'", color: "#f39c12", prop: "☕" },
        { text: "ฝันดี", emoji: "🌙", font: "'Mali'", color: "#2c3e50", prop: "🛌" },
        { text: "HBD", emoji: "🎂", font: "'Sriracha'", color: "#fd79a8", prop: "🎈" },
        { text: "555", emoji: "😂", font: "'Itim'", color: "#fdcb6e", prop: "💢" },
        { text: "รอแป๊บ", emoji: "⏳", font: "'Kanit'", color: "#d63031", prop: "⌚" },
        { text: "สุดยอด", emoji: "👍", font: "'Mali'", color: "#00b894", prop: "🌟" },
        { text: "ยินดีด้วยนะ", emoji: "👏", font: "'Sriracha'", color: "#6c5ce7", prop: "🏆" }
    ];

    const fileInput = document.getElementById('file-input');
    const grid = document.getElementById('sticker-grid');

    // Initial Placeholder
    function init() {
        renderStickers("https://via.placeholder.com/300?text=Your+Face");
    }

    fileInput.onchange = e => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = event => {
                renderStickers(event.target.result);
            };
            reader.readAsDataURL(file);
        }
    };

    function renderStickers(imageSrc) {
        grid.innerHTML = '';
        stickerData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'sticker-card';

            card.innerHTML = `
                <div class="sticker-text" style="font-family: ${item.font}; color: ${item.color};">
                    ${item.text} ${item.emoji}
                </div>
                <div class="sticker-image-wrapper">
                    <span class="prop-icon" style="bottom: 0; right: 0;">${item.prop}</span>
                    <img src="${imageSrc}" class="sticker-image" alt="face">
                </div>
            `;
            grid.appendChild(card);
        });
    }

    init();
</script>

</body>
</html>
